name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build jar
        run: ./build.sh --no-run

      # Every push/PR: grab the jar from the run's Artifacts section.
      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-java
          path: snake-java.jar
          if-no-files-found: error

  release:
    # Only for version tags: publish a permanent, public download link.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: snake-java

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a release for this tag may already exist (created by
          # hand, or by an earlier run of this job that we are retrying).
          # Create it if missing, otherwise just replace the attached jar.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists - uploading jar"
            gh release upload "${GITHUB_REF_NAME}" snake-java.jar --clobber
          else
            echo "creating release ${GITHUB_REF_NAME}"
            gh release create "${GITHUB_REF_NAME}" snake-java.jar \
              --title "snake-java ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
